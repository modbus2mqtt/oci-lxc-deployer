name: Wake-test (wolproxy M2M API)

# Manual-only workflow that exercises the wolproxy M2M Bearer-JWT wake path
# end-to-end:
#   1. Obtain a JWT via client_credentials from Zitadel (auth.ohnewarum.de)
#      with the wolproxy-api audience claim.
#   2. POST it as Bearer to https://wolproxy.ohnewarum.de/wake?mac=...
#   3. Wait for the target host to respond to ping
#
# Designed to run on a private fork (e.g. volkmarnissen/proxvex) where the
# operator has populated these repository secrets via
# production/setup-runner-wake-auth.sh:
#
#   WAKE_CLIENT_ID                 — Machine User clientId
#   WAKE_CLIENT_SECRET             — Machine User clientSecret
#   ZITADEL_ISSUER_URL             — e.g. https://auth.ohnewarum.de
#   WOLPROXY_AUDIENCE_PROJECT_ID   — Zitadel project ID hosting the wolproxy-api app
#
# Why wolproxy and not gptwol: gptwol's /api/wake/<host>-form endpoint is
# UI-form backend with no stable contract. wolproxy provides a documented
# JSON API (POST /wake?mac=..., GET /status?ip=...) maintained by us.

on:
  workflow_dispatch:
    inputs:
      target_mac:
        description: "MAC address of the host to wake (e.g. aa:bb:cc:dd:ee:ff)"
        required: true
      target_broadcast:
        description: "LAN broadcast address (e.g. 192.168.1.255)"
        required: true
        default: "255.255.255.255"
      wolproxy_url:
        description: "Public wolproxy base URL"
        required: true
        default: "https://wolproxy.ohnewarum.de"
      probe_dns:
        description: "DNS name to ping to verify wake (optional; empty = skip ping)"
        required: false
        default: "ubuntupve.lan"

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Acquire JWT from Zitadel
        id: tok
        env:
          ISSUER:    ${{ secrets.ZITADEL_ISSUER_URL }}
          CLIENT_ID: ${{ secrets.WAKE_CLIENT_ID }}
          SECRET:    ${{ secrets.WAKE_CLIENT_SECRET }}
          AUD_PID:   ${{ secrets.WOLPROXY_AUDIENCE_PROJECT_ID }}
        run: |
          set -e
          if [ -z "$ISSUER" ] || [ -z "$CLIENT_ID" ] || [ -z "$SECRET" ] || [ -z "$AUD_PID" ]; then
            echo "::error::Missing required secrets. Run production/setup-runner-wake-auth.sh (after wolproxy deploy) and copy WAKE_CLIENT_ID, WAKE_CLIENT_SECRET, ZITADEL_ISSUER_URL, WOLPROXY_AUDIENCE_PROJECT_ID into repository secrets."
            exit 1
          fi
          SCOPE="openid urn:zitadel:iam:org:project:id:${AUD_PID}:aud urn:zitadel:iam:org:projects:roles"
          JWT=$(curl -fsS -X POST "${ISSUER}/oauth/v2/token" \
            -u "${CLIENT_ID}:${SECRET}" \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "scope=${SCOPE}" \
            | jq -r .access_token)
          if [ -z "$JWT" ] || [ "$JWT" = "null" ]; then
            echo "::error::Token endpoint returned no access_token"
            exit 1
          fi
          echo "::add-mask::$JWT"
          echo "jwt=$JWT" >> "$GITHUB_OUTPUT"
          echo "JWT acquired (${#JWT} chars)"

      - name: Call wolproxy /wake
        env:
          JWT: ${{ steps.tok.outputs.jwt }}
          URL: ${{ inputs.wolproxy_url }}/wake?mac=${{ inputs.target_mac }}&broadcast=${{ inputs.target_broadcast }}
        run: |
          set -e
          echo "POST $URL"
          curl -fsS -X POST -H "Authorization: Bearer $JWT" "$URL"
          echo
          echo "Wake request accepted by wolproxy"

      - name: Probe target until reachable
        if: ${{ inputs.probe_dns != '' }}
        env:
          PROBE: ${{ inputs.probe_dns }}
        run: |
          set -e
          for i in $(seq 1 60); do
            if ping -c 1 -W 1 "$PROBE" >/dev/null 2>&1; then
              echo "${PROBE} responded after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::${PROBE} did not respond within 120s"
          exit 1
